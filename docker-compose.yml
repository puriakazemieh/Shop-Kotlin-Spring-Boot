name: shop

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./db/db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    networks:
      - postgres_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  postgres_net:
    name: postgres_db
