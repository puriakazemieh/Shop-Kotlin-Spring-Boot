openapi: 3.0.1
info:
  title: Shopping RESTful API V1
  description: >
    Authentication & authorization using JWT access tokens and
    DB-backed revokeable refresh tokens.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: DEVELOPMENT
  - url: https://kazemieh.com
    description: PRODUCTION

tags:
  - name: auth
    description: Authentication endpoints

security:
  - BearerAuth: [ ]

paths:
  /api/auth/register:
    post:
      tags: [ auth ]
      summary: Register a new user
      operationId: register
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
              fullName: "Puria Kazemieh"
              phone: "09123456789"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: Login with email and password
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: Refresh tokens (rotation) - returns a new access token and a new refresh token
      operationId: refresh
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: Logout current session (revoke refresh token)
      operationId: logout
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '204':
          description: Logged out successfully

  /api/auth/logout-all:
    post:
      tags: [ auth ]
      summary: Logout all devices (revoke all refresh tokens for current user)
      operationId: logoutAll
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: All sessions revoked successfully
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/me:
    get:
      tags: [ user ]
      summary: Get current user profile
      operationId: getMe
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [ user ]
      summary: Update current user profile (partial)
      operationId: updateMe
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              fullName: "New Name"
              phone: "09120000000"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    /api/users/me/email:
      patch:
        tags: [ user ]
        summary: Change current user email
        operationId: changeEmail
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEmailRequest'
              example:
                email: "new@mail.com"
        responses:
          '200':
            description: Updated
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'

    /api/users/me/password:
      patch:
        tags: [ user ]
        summary: Change current user password
        operationId: changePassword
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordRequest'
              example:
                currentPassword: "12345678"
                newPassword: "87654321"
        responses:
          '204':
            description: Updated

    /api/users/me/deactivate:
      post:
        tags: [ user ]
        summary: Deactivate current user account
        operationId: deactivateMe
        security:
          - BearerAuth: [ ]
        responses:
          '204':
            description: Deactivated

    components:
      schemas:
        UpdateMeRequest:
          type: object
          properties:
            fullName:
              type: string
              nullable: true
              maxLength: 255
            phone:
              type: string
              nullable: true
              maxLength: 30

        ChangeEmailRequest:
          type: object
          required: [ email ]
          properties:
            email:
              type: string
              format: email

        ChangePasswordRequest:
          type: object
          required: [ currentPassword, newPassword ]
          properties:
            currentPassword:
              type: string
            newPassword:
              type: string
              minLength: 8
              maxLength: 100

  /api/addresses:
    get:
      tags: [ address ]
      summary: List my addresses
      operationId: listAddresses
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
    post:
      tags: [ address ]
      summary: Create an address
      operationId: createAddress
      security: [ { BearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

  /api/addresses/{id}:
    get:
      tags: [ address ]
      summary: Get an address by id
      operationId: getAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

    patch:
      tags: [ address ]
      summary: Update an address (partial)
      operationId: updateAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

    delete:
      tags: [ address ]
      summary: Delete an address
      operationId: deleteAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/addresses/default:
    get:
      tags: [ address ]
      summary: Get my default address
      operationId: getDefaultAddress
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

  /api/addresses/{id}/default:
    post:
      tags: [ address ]
      summary: Set an address as default
      operationId: setDefaultAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

  /api/orders:
    get:
      tags: [ order ]
      summary: List my orders
      operationId: listMyOrders
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponse' }

    post:
      tags: [ order ]
      summary: Create order (reserves inventory)
      operationId: createOrder
      security: [ { BearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }

  /api/orders/{id}:
    get:
      tags: [ order ]
      summary: Get my order details
      operationId: getMyOrder
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }

  /api/orders/{id}/cancel:
    post:
      tags: [ order ]
      summary: Cancel my order (releases reserved inventory)
      operationId: cancelMyOrder
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Canceled

  /api/categories:
    get:
      tags: [catalog]
      summary: Category tree
      operationId: getCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }

  /api/products:
    get:
      tags: [catalog]
      summary: Product list (search & filters)
      operationId: listProducts
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          description: Filter by category (includes all descendant categories)
          schema: { type: integer, format: int64 }
        - name: categorySlug
          in: query
          description: Filter by category slug (includes descendants)
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPageResponse' }

  /api/products/{slug}:
    get:
      tags: [catalog]
      summary: Product detail by slug
      operationId: getProductDetail
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailResponse' }

  /api/admin/categories:
    get:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: List categories (admin)
      operationId: adminListCategories
      responses:
        '200':
          description: OK
    post:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Create category
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateCategoryRequest' }
      responses:
        '200': { description: OK }

  /api/admin/products:
    get:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: List products (admin)
      operationId: adminListProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200': { description: OK }
    post:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Create product
      operationId: adminCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateProductRequest' }
      responses:
        '200': { description: OK }

  /api/admin/products/{id}:
    get:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Product detail (admin)
      operationId: adminProductDetail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
    patch:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Update product
      operationId: adminUpdateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateProductRequest' }
      responses:
        '200': { description: OK }
    delete:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Delete product (hard)
      operationId: adminDeleteProductHard
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }

  /api/admin/products/{productId}/variants:
    post:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Create variant for product
      operationId: adminCreateVariant
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateVariantRequest' }
      responses:
        '200': { description: OK }

  /api/admin/variants/{variantId}:
    patch:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Update variant
      operationId: adminUpdateVariant
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateVariantRequest' }
      responses:
        '200': { description: OK }

  /api/admin/variants/{variantId}/inventory:
    get:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Get inventory
      operationId: adminGetInventory
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
    put:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Set inventory onHand
      operationId: adminSetInventory
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInventorySetRequest' }
      responses:
        '200': { description: OK }

  /api/admin/variants/{variantId}/inventory/adjust:
    patch:
      tags: [admin-catalog]
      security: [{ BearerAuth: [] }]
      summary: Adjust inventory onHand by delta
      operationId: adminAdjustInventory
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInventoryAdjustRequest' }
      responses:
        '200': { description: OK }

  /api/admin/orders:
    get:
      tags: [admin-orders]
      security: [{ BearerAuth: [] }]
      summary: List orders (admin)
      operationId: adminListOrders
      parameters:
        - name: status
          in: query
          description: Filter by status (PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELED)
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponseAdminOrderSummaryResponse' }

  /api/admin/orders/{id}:
    get:
      tags: [admin-orders]
      security: [{ BearerAuth: [] }]
      summary: Order detail (admin)
      operationId: adminOrderDetail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderDetailResponse' }

  /api/admin/orders/{id}/status:
    patch:
      tags: [admin-orders]
      security: [{ BearerAuth: [] }]
      summary: Update order status (admin)
      operationId: adminUpdateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateOrderStatusRequest' }
            example:
              status: "CONFIRMED"
      responses:
        '204':
          description: Updated

  /api/cart:
    get:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Get my cart
      operationId: getCart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
    delete:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Clear my cart
      operationId: clearCart
      responses:
        '204':
          description: Cleared

  /api/cart/items:
    post:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Add item to cart (or increase qty)
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

  /api/cart/items/{itemId}:
    patch:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Update cart item quantity (qty=0 removes)
      operationId: updateCartItemQty
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

    delete:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

  /api/cart/items/{variantId}:
    put:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Set cart quantity by variantId (qty=0 removes)
      operationId: setCartVariantQty
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartVariantQtyRequest' }
            example:
              qty: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

  /api/cart/items/{variantId}/adjust:
    patch:
      tags: [cart]
      security: [{ BearerAuth: [] }]
      summary: Adjust cart quantity by variantId (delta can be negative)
      operationId: adjustCartVariantQty
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustCartVariantQtyRequest' }
            example:
              delta: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

  /api/admin/orders/{id}/shipping:
    patch:
      tags: [admin-orders]
      security: [{ BearerAuth: [] }]
      summary: Update shipping carrier/tracking (admin)
      operationId: adminUpdateShipping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateShippingRequest' }
      responses:
        '204': { description: Updated }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 100
        fullName:
          type: string
          nullable: true
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: DB-backed opaque refresh token (revokeable)

    LogoutRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: Refresh token to revoke

    AuthResponse:
      type: object
      required: [ accessToken, refreshToken, user ]
      properties:
        accessToken:
          type: string
          description: JWT access token (short-lived)
        refreshToken:
          type: string
          description: Opaque refresh token (long-lived, revokeable)
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required: [ id, email, role, isActive ]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          description: e.g. CUSTOMER or ADMIN
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateAddressRequest:
      type: object
      required: [ receiverName, receiverPhone, country, province, city, addressLine1 ]
      properties:
        receiverName: { type: string, maxLength: 255 }
        receiverPhone: { type: string, maxLength: 30 }
        country: { type: string, maxLength: 80, default: "IR" }
        province: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 120 }
        addressLine1: { type: string, maxLength: 255 }
        addressLine2: { type: string, nullable: true, maxLength: 255 }
        postalCode: { type: string, nullable: true, maxLength: 20 }
        setAsDefault: { type: boolean, default: false }

    UpdateAddressRequest:
      type: object
      properties:
        receiverName: { type: string, nullable: true, maxLength: 255 }
        receiverPhone: { type: string, nullable: true, maxLength: 30 }
        country: { type: string, nullable: true, maxLength: 80 }
        province: { type: string, nullable: true, maxLength: 120 }
        city: { type: string, nullable: true, maxLength: 120 }
        addressLine1: { type: string, nullable: true, maxLength: 255 }
        addressLine2: { type: string, nullable: true, maxLength: 255 }
        postalCode: { type: string, nullable: true, maxLength: 20 }

    AddressResponse:
      type: object
      required: [ id, receiverName, receiverPhone, country, province, city, addressLine1, isDefault ]
      properties:
        id: { type: integer, format: int64 }
        receiverName: { type: string }
        receiverPhone: { type: string }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }

    CreateOrderItemRequest:
      type: object
      required: [ variantId, qty ]
      properties:
        variantId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }

    CreateOrderRequest:
      type: object
      required: [ items ]
      properties:
        addressId: { type: integer, format: int64, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderItemRequest' }

    OrderResponse:
      type: object
      required: [ id, status, subtotalPrice, shippingPrice, totalPrice ]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        subtotalPrice: { type: number }
        shippingPrice: { type: number }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }

    AddressSnapshotResponse:
      type: object
      required: [ receiverName, receiverPhone, country, province, city, addressLine1 ]
      properties:
        receiverName: { type: string }
        receiverPhone: { type: string }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }

    OrderItemResponse:
      type: object
      required: [ variantId, qty, unitPrice, title, options ]
      properties:
        variantId: { type: integer, format: int64 }
        qty: { type: integer }
        unitPrice: { type: number }
        title: { type: string }
        options:
          type: object
          additionalProperties:
            type: string

    OrderDetailResponse:
      type: object
      required: [ id, status, subtotalPrice, shippingPrice, totalPrice, address, items ]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        subtotalPrice: { type: number }
        shippingPrice: { type: number }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }
        address: { $ref: '#/components/schemas/AddressSnapshotResponse' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }

    CategoryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryResponse' }

    ProductSummaryResponse:
      type: object
      required: [id, title, slug, inStock]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        inStock: { type: boolean }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }

    ProductImageResponse:
      type: object
      required: [url, sortOrder]
      properties:
        url: { type: string }
        sortOrder: { type: integer }

    VariantResponse:
      type: object
      required: [id, sku, price, options, availableQty, isActive]
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        options:
          type: object
          additionalProperties:
            type: string
        availableQty: { type: integer }
        isActive: { type: boolean }

    ProductDetailResponse:
      type: object
      required: [id, title, slug, images, variants]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImageResponse' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/VariantResponse' }
        createdAt: { type: string, format: date-time, nullable: true }

    ProductPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummaryResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ---------- Common Page ----------
    PageResponseAdminProductResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ---------- Category ----------
    AdminCreateCategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 140 }
        parentId: { type: integer, format: int64, nullable: true }

    AdminUpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, nullable: true, maxLength: 120 }
        slug: { type: string, nullable: true, maxLength: 140 }
        parentId: { type: integer, format: int64, nullable: true }

    AdminCategoryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    # ---------- Product ----------
    AdminCreateProductRequest:
      type: object
      required: [title, slug]
      properties:
        categoryId: { type: integer, format: int64, nullable: true }
        title: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 280 }
        description: { type: string, nullable: true }
        basePrice: { type: number, nullable: true }
        isActive: { type: boolean, default: true }

    AdminUpdateProductRequest:
      type: object
      properties:
        categoryId: { type: integer, format: int64, nullable: true }
        title: { type: string, nullable: true, maxLength: 255 }
        slug: { type: string, nullable: true, maxLength: 280 }
        description: { type: string, nullable: true }
        basePrice: { type: number, nullable: true }
        isActive: { type: boolean, nullable: true }

    AdminProductResponse:
      type: object
      required: [id, title, slug, isActive]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        categoryId: { type: integer, format: int64, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    AdminProductDetailResponse:
      type: object
      required: [product, images, variants]
      properties:
        product: { $ref: '#/components/schemas/AdminProductResponse' }
        images:
          type: array
          items: { $ref: '#/components/schemas/AdminProductImageResponse' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AdminVariantResponse' }

    # ---------- Images ----------
    AdminAddImageRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        sortOrder: { type: integer, nullable: true }

    AdminImageOrderItem:
      type: object
      required: [id, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        sortOrder: { type: integer }

    AdminReorderImagesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AdminImageOrderItem' }

    AdminProductImageResponse:
      type: object
      required: [id, url, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        sortOrder: { type: integer }

    # ---------- Variants + Inventory ----------
    AdminCreateVariantRequest:
      type: object
      required: [options, sku, price]
      properties:
        options:
          type: object
          additionalProperties:
            type: string
        sku: { type: string, maxLength: 80 }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: number, nullable: true, minimum: 0 }
        isActive: { type: boolean, default: true }
        initialOnHand: { type: integer, minimum: 0, default: 0 }

    AdminUpdateVariantRequest:
      type: object
      properties:
        options:
          type: object
          additionalProperties:
            type: string
        sku: { type: string, nullable: true, maxLength: 80 }
        price: { type: number, nullable: true, minimum: 0 }
        compareAtPrice: { type: number, nullable: true, minimum: 0 }
        isActive: { type: boolean, nullable: true }

    AdminInventorySetRequest:
      type: object
      required: [onHand]
      properties:
        onHand: { type: integer, minimum: 0 }
        version: { type: integer, nullable: true }

    AdminInventoryAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta: { type: integer }
        version: { type: integer, nullable: true }

    AdminInventoryResponse:
      type: object
      required: [variantId, onHand, reserved, available, version]
      properties:
        variantId: { type: integer, format: int64 }
        onHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        version: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true }

    AdminVariantResponse:
      type: object
      required: [id, productId, options, sku, price, isActive]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        options:
          type: object
          additionalProperties:
            type: string
        sku: { type: string }
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        isActive: { type: boolean }
        inventory:
          $ref: '#/components/schemas/AdminInventoryResponse'

    PageResponseAdminOrderSummaryResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
      items:
        type: array
        items: { $ref: '#/components/schemas/AdminOrderSummaryResponse' }
      page: { type: integer }
      size: { type: integer }
      totalElements: { type: integer, format: int64 }
      totalPages: { type: integer }

    AdminOrderSummaryResponse:
      type: object
      required: [id, userId, userEmail, status, totalPrice]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        userEmail: { type: string, format: email }
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELED]
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }

    AdminOrderDetailResponse:
      type: object
      required: [id, userId, userEmail, status, subtotalPrice, shippingPrice, totalPrice, addressSnapshot, items]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        userEmail: { type: string, format: email }
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELED]
        subtotalPrice: { type: number }
        shippingPrice: { type: number }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        addressSnapshot:
          description: Address snapshot stored at order time (JSON)
          type: object
          additionalProperties: true
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminOrderItemResponse' }

    AdminOrderItemResponse:
      type: object
      required: [id, variantId, qty, unitPriceSnapshot, titleSnapshot, optionsSnapshot]
      properties:
        id: { type: integer, format: int64 }
        variantId: { type: integer, format: int64 }
        qty: { type: integer }
        unitPriceSnapshot: { type: number }
        titleSnapshot: { type: string }
        optionsSnapshot:
          type: object
          additionalProperties:
            type: string

    AdminUpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELED]
      ApiError:
        type: object
        properties:
          message:
            type: string
            nullable: true
          status:
            type: string
            description: HTTP status name (e.g. UNAUTHORIZED)
          code:
            type: integer
            description: HTTP status code (e.g. 401)
          errorCode:
            type: string
            nullable: true
          path:
            type: string
            nullable: true
          timestamp:
            type: string
            format: date-time

    AddCartItemRequest:
      type: object
      required: [variantId, qty]
      properties:
        variantId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }

    UpdateCartItemRequest:
      type: object
      required: [qty]
      properties:
        qty:
          type: integer
          minimum: 0
          description: 0 means remove

    CartItemResponse:
      type: object
      required: [id, variantId, qty, productId, productTitle, productSlug, options, price, availableQty, isActive, lineTotal]
      properties:
        id: { type: integer, format: int64 }
        variantId: { type: integer, format: int64 }
        qty: { type: integer }
        productId: { type: integer, format: int64 }
        productTitle: { type: string }
        productSlug: { type: string }
        imageUrl: { type: string, nullable: true }
        options:
          type: object
          additionalProperties:
            type: string
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        availableQty: { type: integer }
        isActive: { type: boolean }
        lineTotal: { type: number }

    CartResponse:
      type: object
      required: [items, subtotal, totalQty]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponse' }
        subtotal: { type: number }
        totalQty: { type: integer }

    SetCartVariantQtyRequest:
      type: object
      required: [qty]
      properties:
        qty:
          type: integer
          minimum: 0
          description: 0 means remove

    AdjustCartVariantQtyRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Can be negative or positive

    AdminUpdateShippingRequest:
      type: object
      properties:
        shippingCarrier: { type: string, nullable: true, maxLength: 80 }
        trackingCode: { type: string, nullable: true, maxLength: 120 }
        markShipped: { type: boolean, default: false }
