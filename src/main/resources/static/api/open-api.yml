openapi: 3.0.1
info:
  title: Shopping RESTful API V1
  description: >
    Authentication & authorization using JWT access tokens and
    DB-backed revokeable refresh tokens.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: DEVELOPMENT
  - url: https://kazemieh.com
    description: PRODUCTION

tags:
  - name: auth
    description: Authentication endpoints

security:
  - BearerAuth: [ ]

paths:
  /api/auth/register:
    post:
      tags: [ auth ]
      summary: Register a new user
      operationId: register
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
              fullName: "Puria Kazemieh"
              phone: "09123456789"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: Login with email and password
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: Refresh tokens (rotation) - returns a new access token and a new refresh token
      operationId: refresh
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: Logout current session (revoke refresh token)
      operationId: logout
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '204':
          description: Logged out successfully

  /api/auth/logout-all:
    post:
      tags: [ auth ]
      summary: Logout all devices (revoke all refresh tokens for current user)
      operationId: logoutAll
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: All sessions revoked successfully
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/me:
    get:
      tags: [ user ]
      summary: Get current user profile
      operationId: getMe
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [ user ]
      summary: Update current user profile (partial)
      operationId: updateMe
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              fullName: "New Name"
              phone: "09120000000"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    /api/users/me/email:
      patch:
        tags: [ user ]
        summary: Change current user email
        operationId: changeEmail
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEmailRequest'
              example:
                email: "new@mail.com"
        responses:
          '200':
            description: Updated
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'

    /api/users/me/password:
      patch:
        tags: [ user ]
        summary: Change current user password
        operationId: changePassword
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordRequest'
              example:
                currentPassword: "12345678"
                newPassword: "87654321"
        responses:
          '204':
            description: Updated

    /api/users/me/deactivate:
      post:
        tags: [ user ]
        summary: Deactivate current user account
        operationId: deactivateMe
        security:
          - BearerAuth: [ ]
        responses:
          '204':
            description: Deactivated

    components:
      schemas:
        UpdateMeRequest:
          type: object
          properties:
            fullName:
              type: string
              nullable: true
              maxLength: 255
            phone:
              type: string
              nullable: true
              maxLength: 30

        ChangeEmailRequest:
          type: object
          required: [ email ]
          properties:
            email:
              type: string
              format: email

        ChangePasswordRequest:
          type: object
          required: [ currentPassword, newPassword ]
          properties:
            currentPassword:
              type: string
            newPassword:
              type: string
              minLength: 8
              maxLength: 100

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 100
        fullName:
          type: string
          nullable: true
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: DB-backed opaque refresh token (revokeable)

    LogoutRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: Refresh token to revoke

    AuthResponse:
      type: object
      required: [ accessToken, refreshToken, user ]
      properties:
        accessToken:
          type: string
          description: JWT access token (short-lived)
        refreshToken:
          type: string
          description: Opaque refresh token (long-lived, revokeable)
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required: [ id, email, role, isActive ]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          description: e.g. CUSTOMER or ADMIN
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ApiError:
      type: object
      properties:
        message:
          type: string
          nullable: true
        status:
          type: string
          description: HTTP status name (e.g. UNAUTHORIZED)
        code:
          type: integer
          description: HTTP status code (e.g. 401)
        errorCode:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time