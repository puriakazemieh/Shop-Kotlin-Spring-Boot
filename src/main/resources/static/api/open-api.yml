openapi: 3.0.1
info:
  title: Shopping RESTful API V1
  description: >
    Authentication & authorization using JWT access tokens and
    DB-backed revokeable refresh tokens.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: DEVELOPMENT
  - url: https://kazemieh.com
    description: PRODUCTION

tags:
  - name: auth
    description: Authentication endpoints

security:
  - BearerAuth: [ ]

paths:
  /api/auth/register:
    post:
      tags: [ auth ]
      summary: Register a new user
      operationId: register
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
              fullName: "Puria Kazemieh"
              phone: "09123456789"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: Login with email and password
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: puriakazemieh@gmail.com
              password: "12345678"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: Refresh tokens (rotation) - returns a new access token and a new refresh token
      operationId: refresh
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: Logout current session (revoke refresh token)
      operationId: logout
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: "opaque_refresh_token_here"
      responses:
        '204':
          description: Logged out successfully

  /api/auth/logout-all:
    post:
      tags: [ auth ]
      summary: Logout all devices (revoke all refresh tokens for current user)
      operationId: logoutAll
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: All sessions revoked successfully
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/me:
    get:
      tags: [ user ]
      summary: Get current user profile
      operationId: getMe
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [ user ]
      summary: Update current user profile (partial)
      operationId: updateMe
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              fullName: "New Name"
              phone: "09120000000"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    /api/users/me/email:
      patch:
        tags: [ user ]
        summary: Change current user email
        operationId: changeEmail
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEmailRequest'
              example:
                email: "new@mail.com"
        responses:
          '200':
            description: Updated
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'

    /api/users/me/password:
      patch:
        tags: [ user ]
        summary: Change current user password
        operationId: changePassword
        security:
          - BearerAuth: [ ]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordRequest'
              example:
                currentPassword: "12345678"
                newPassword: "87654321"
        responses:
          '204':
            description: Updated

    /api/users/me/deactivate:
      post:
        tags: [ user ]
        summary: Deactivate current user account
        operationId: deactivateMe
        security:
          - BearerAuth: [ ]
        responses:
          '204':
            description: Deactivated

    components:
      schemas:
        UpdateMeRequest:
          type: object
          properties:
            fullName:
              type: string
              nullable: true
              maxLength: 255
            phone:
              type: string
              nullable: true
              maxLength: 30

        ChangeEmailRequest:
          type: object
          required: [ email ]
          properties:
            email:
              type: string
              format: email

        ChangePasswordRequest:
          type: object
          required: [ currentPassword, newPassword ]
          properties:
            currentPassword:
              type: string
            newPassword:
              type: string
              minLength: 8
              maxLength: 100

  /api/addresses:
    get:
      tags: [ address ]
      summary: List my addresses
      operationId: listAddresses
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
    post:
      tags: [ address ]
      summary: Create an address
      operationId: createAddress
      security: [ { BearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

  /api/addresses/{id}:
    get:
      tags: [ address ]
      summary: Get an address by id
      operationId: getAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

    patch:
      tags: [ address ]
      summary: Update an address (partial)
      operationId: updateAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

    delete:
      tags: [ address ]
      summary: Delete an address
      operationId: deleteAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/addresses/default:
    get:
      tags: [ address ]
      summary: Get my default address
      operationId: getDefaultAddress
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

  /api/addresses/{id}/default:
    post:
      tags: [ address ]
      summary: Set an address as default
      operationId: setDefaultAddress
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }

  /api/orders:
    get:
      tags: [ order ]
      summary: List my orders
      operationId: listMyOrders
      security: [ { BearerAuth: [ ] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderResponse' }

    post:
      tags: [ order ]
      summary: Create order (reserves inventory)
      operationId: createOrder
      security: [ { BearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }

  /api/orders/{id}:
    get:
      tags: [ order ]
      summary: Get my order details
      operationId: getMyOrder
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }

  /api/orders/{id}/cancel:
    post:
      tags: [ order ]
      summary: Cancel my order (releases reserved inventory)
      operationId: cancelMyOrder
      security: [ { BearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Canceled

  /api/categories:
    get:
      tags: [catalog]
      summary: Category tree
      operationId: getCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }

  /api/sizes:
    get:
      tags: [catalog]
      summary: Sizes
      operationId: getSizes
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SizeResponse' }

  /api/colors:
    get:
      tags: [catalog]
      summary: Colors
      operationId: getColors
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ColorResponse' }

  /api/products:
    get:
      tags: [catalog]
      summary: Product list (search & filters)
      operationId: listProducts
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: sizeId
          in: query
          schema: { type: integer, format: int64 }
        - name: colorId
          in: query
          schema: { type: integer, format: int64 }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPageResponse' }

  /api/products/{slug}:
    get:
      tags: [catalog]
      summary: Product detail by slug
      operationId: getProductDetail
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailResponse' }



components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 100
        fullName:
          type: string
          nullable: true
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 30

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: DB-backed opaque refresh token (revokeable)

    LogoutRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: Refresh token to revoke

    AuthResponse:
      type: object
      required: [ accessToken, refreshToken, user ]
      properties:
        accessToken:
          type: string
          description: JWT access token (short-lived)
        refreshToken:
          type: string
          description: Opaque refresh token (long-lived, revokeable)
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required: [ id, email, role, isActive ]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          description: e.g. CUSTOMER or ADMIN
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateAddressRequest:
      type: object
      required: [ receiverName, receiverPhone, country, province, city, addressLine1 ]
      properties:
        receiverName: { type: string, maxLength: 255 }
        receiverPhone: { type: string, maxLength: 30 }
        country: { type: string, maxLength: 80, default: "IR" }
        province: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 120 }
        addressLine1: { type: string, maxLength: 255 }
        addressLine2: { type: string, nullable: true, maxLength: 255 }
        postalCode: { type: string, nullable: true, maxLength: 20 }
        setAsDefault: { type: boolean, default: false }

    UpdateAddressRequest:
      type: object
      properties:
        receiverName: { type: string, nullable: true, maxLength: 255 }
        receiverPhone: { type: string, nullable: true, maxLength: 30 }
        country: { type: string, nullable: true, maxLength: 80 }
        province: { type: string, nullable: true, maxLength: 120 }
        city: { type: string, nullable: true, maxLength: 120 }
        addressLine1: { type: string, nullable: true, maxLength: 255 }
        addressLine2: { type: string, nullable: true, maxLength: 255 }
        postalCode: { type: string, nullable: true, maxLength: 20 }

    AddressResponse:
      type: object
      required: [ id, receiverName, receiverPhone, country, province, city, addressLine1, isDefault ]
      properties:
        id: { type: integer, format: int64 }
        receiverName: { type: string }
        receiverPhone: { type: string }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }

    CreateOrderItemRequest:
      type: object
      required: [ variantId, qty ]
      properties:
        variantId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }

    CreateOrderRequest:
      type: object
      required: [ items ]
      properties:
        addressId: { type: integer, format: int64, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderItemRequest' }

    OrderResponse:
      type: object
      required: [ id, status, subtotalPrice, shippingPrice, totalPrice ]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        subtotalPrice: { type: number }
        shippingPrice: { type: number }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }

    AddressSnapshotResponse:
      type: object
      required: [ receiverName, receiverPhone, country, province, city, addressLine1 ]
      properties:
        receiverName: { type: string }
        receiverPhone: { type: string }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }

    OrderItemResponse:
      type: object
      required: [ variantId, qty, unitPrice, title, size, color ]
      properties:
        variantId: { type: integer, format: int64 }
        qty: { type: integer }
        unitPrice: { type: number }
        title: { type: string }
        size: { type: string }
        color: { type: string }

    OrderDetailResponse:
      type: object
      required: [ id, status, subtotalPrice, shippingPrice, totalPrice, address, items ]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        subtotalPrice: { type: number }
        shippingPrice: { type: number }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, nullable: true }
        address: { $ref: '#/components/schemas/AddressSnapshotResponse' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }

    CategoryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryResponse' }

    SizeResponse:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sortOrder: { type: integer }

    ColorResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        hex: { type: string, nullable: true }

    ProductSummaryResponse:
      type: object
      required: [id, title, slug, inStock]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        inStock: { type: boolean }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }

    ProductImageResponse:
      type: object
      required: [url, sortOrder]
      properties:
        url: { type: string }
        sortOrder: { type: integer }

    VariantResponse:
      type: object
      required: [id, sku, price, size, color, availableQty, isActive]
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        size: { $ref: '#/components/schemas/SizeResponse' }
        color: { $ref: '#/components/schemas/ColorResponse' }
        availableQty: { type: integer }
        isActive: { type: boolean }

    ProductDetailResponse:
      type: object
      required: [id, title, slug, images, variants]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImageResponse' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/VariantResponse' }
        createdAt: { type: string, format: date-time, nullable: true }

    ProductPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummaryResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }




    ApiError:
      type: object
      properties:
        message:
          type: string
          nullable: true
        status:
          type: string
          description: HTTP status name (e.g. UNAUTHORIZED)
        code:
          type: integer
          description: HTTP status code (e.g. 401)
        errorCode:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

